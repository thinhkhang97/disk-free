[project]
name = "disk-free"
version = "0.1.0"
description = "CLI tool to list subdirectory sizes"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.0.0",
]

[project.scripts]
disk_free = "disk_free.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disk_free"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
